# SenGLEAN (LightSenGLEAN) super-resolution for a region and acquisition window.
#   prep : find usable Sentinel-2 days, snap the AOI to a 10 m UTM grid, split it into <= max_chunks padded chunks (size chosen from the AOI area)
#   adapt: one job per day: adapt the model once on a center crop
#   infer: one job per day x chunk, in parallel: enhance the chunk with the shared adapted weights
#   merge: one job per day: stitch the chunk cores into a single 5 m raster
name: senglean
run-name: SenGLEAN ${{ inputs.begin_date }}-${{ inputs.end_date }}

on:
  workflow_dispatch:
    inputs:
      aoi:
        type: string
        required: true
        description: "Bounding box 'minlon minlat maxlon maxlat', each side 5.5-40 km"
        default: "-66.7271 45.9052 -66.5591 46.0220"
      begin_date:
        type: string
        required: true
        description: Earliest acquisition date, YYYYmmdd
        default: "20250601"
      end_date:
        type: string
        required: true
        description: Latest acquisition date, YYYYmmdd
        default: "20250915"
      cloud_cover:
        type: string
        required: true
        description: Maximum Sentinel-2 cloud cover (%)
        default: "10"
      max_scenes:
        type: string
        required: true
        description: Process at most this many days, least cloudy first (each runs its own adaptation)
        default: "1"
      max_chunks:
        type: string
        required: true
        description: "Split the AOI into at most this many parallel chunk jobs per day (chunks are 4-13 km; free plans run ~20 jobs at once)"
        default: "16"
      nepoch:
        type: string
        required: true
        description: Target-adaptation steps (150 = paper setting; use 5 for a quick test)
        default: "150"
      batch:
        type: string
        required: true
        description: Adaptation batch size (1 fits 7 GB private runners; 2 needs the 16 GB public ones)
        default: "1"
      ta_km:
        type: string
        required: true
        description: Adapt on a centered crop of this size (km), at least 5.2
        default: "6"

permissions:
  contents: read

env:
  AOI: ${{ inputs.aoi }}
  BEGIN: ${{ inputs.begin_date }}
  END: ${{ inputs.end_date }}
  CLOUD: ${{ inputs.cloud_cover }}
  MAX_SCENES: ${{ inputs.max_scenes }}
  MAX_CHUNKS: ${{ inputs.max_chunks }}
  NEPOCH: ${{ inputs.nepoch }}
  BATCH: ${{ inputs.batch }}
  TA_KM: ${{ inputs.ta_km }}

jobs:
  prep:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ayush12gupta/senglean-env:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      DAYS: ${{ steps.pick.outputs.DAYS }}
      CHUNKS: ${{ steps.pick.outputs.CHUNKS }}
      DAY_COUNT: ${{ steps.pick.outputs.DAY_COUNT }}
      CHUNK_COUNT: ${{ steps.pick.outputs.CHUNK_COUNT }}
    steps:
      - name: Hardware
        run: |
          echo "HW $(lscpu | awk -F: '/Model name/{gsub(/^ +/,"",$2); print $2}') | nproc=$(nproc) | load=$(cut -d' ' -f1-3 /proc/loadavg) | ram=$(free -m | awk 'NR==2{print $2}')MB"
      - uses: actions/checkout@v4
      - name: Select days and plan chunks
        id: pick
        run: /opt/dv/bin/python -u ci/prep_scenes.py "$BEGIN" "$END" "$AOI" "$CLOUD" "$MAX_SCENES" "$MAX_CHUNKS" "$TA_KM"
      - name: Summarize request
        run: |
          {
            echo "## SenGLEAN request"
            echo "- AOI: \`$AOI\`"
            echo "- Acquisition window: \`$BEGIN\` to \`$END\`, cloud < \`$CLOUD\`%"
            echo "- Days: \`${{ steps.pick.outputs.DAY_COUNT }}\` (max \`$MAX_SCENES\`), chunks per day: \`${{ steps.pick.outputs.CHUNK_COUNT }}\`"
            echo "- Adaptation: \`$NEPOCH\` steps, batch \`$BATCH\`, on a \`$TA_KM\` km crop"
          } >> "$GITHUB_STEP_SUMMARY"

  adapt:
    needs: prep
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prep.outputs.DAYS) }}
    name: adapt ${{ matrix.date }} (cloud ${{ matrix.cloud }}%)
    runs-on: ubuntu-latest
    timeout-minutes: 350 # hosted-runner hard cap is 360
    container:
      image: ghcr.io/ayush12gupta/senglean-env:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged # lets the swap step below act on the host
      volumes:
        - /mnt:/hostmnt
    defaults:
      run:
        shell: bash # -eo pipefail, so `| tee` cannot hide a failure
    env:
      DATE: ${{ matrix.date }}
      ITEMS: ${{ matrix.items }}
      EPSG: ${{ matrix.epsg }}
      AOI_UTM: ${{ matrix.aoi }}
      TA_UTM: ${{ matrix.ta }}
    steps:
      - name: Hardware
        run: |
          echo "HW $(lscpu | awk -F: '/Model name/{gsub(/^ +/,"",$2); print $2}') | nproc=$(nproc) | load=$(cut -d' ' -f1-3 /proc/loadavg) | ram=$(free -m | awk 'NR==2{print $2}')MB"
      - uses: actions/checkout@v4
      - name: Swap (safety margin on 7 GB runners)
        run: |
          fallocate -l 8G /hostmnt/swapfile && chmod 600 /hostmnt/swapfile && mkswap /hostmnt/swapfile >/dev/null \
            && swapon /hostmnt/swapfile && free -m || echo "swap not available, continuing without it"

      - name: Base weights (cached)
        id: w
        uses: actions/cache@v4
        with:
          path: LightSenGLEAN/weights/gens_light_sen_glean.pt
          key: weights-light-1xYVdb8y
      - name: Download base weights
        if: steps.w.outputs.cache-hit != 'true'
        run: |
          gdown 1xYVdb8ylri04ChkkcUbesVxzo3RDBcoa -O LightSenGLEAN/weights/gens_light_sen_glean.pt
          test "$(stat -c%s LightSenGLEAN/weights/gens_light_sen_glean.pt)" -gt 100000000 # Drive quota pages are tiny HTML

      - name: Adaptation crop and AOI-wide normalisation
        run: |
          PY=/opt/dv/bin/python
          $PY ci/make_clip.py --items "$ITEMS" --epsg "$EPSG" --bounds $TA_UTM --out data/ta_crop.tif
          $PY ci/make_clip.py --items "$ITEMS" --epsg "$EPSG" --bounds $AOI_UTM --res 60 --out data/coarse.tif
          $PY ci/norm.py data/coarse.tif norm.json

      - name: Target adaptation
        working-directory: LightSenGLEAN/Testing
        run: |
          start=$(date +%s)
          ( while true; do echo "MEM $(free -m | awk 'NR==2{print $3}') MB of $(free -m | awk 'NR==2{print $2}')" | tee -a "$RUNNER_TEMP/mem.log"; sleep 5; done ) &
          trap 'kill $! 2>/dev/null' EXIT
          python eval_light_glean_all.py --checkpoint_g ../weights/gens_light_sen_glean.pt \
            --checkpoint_d ../weights/discs_all.pt --batch "$BATCH" --nepoch "$NEPOCH" --do_TA \
            --data_path "$GITHUB_WORKSPACE/data/ta_crop.tif" 2>&1 | tee ta.log
          total=$(( $(date +%s) - start ))
          ta=$(grep 'Time Elapsed' ta.log | tail -1 | awk '{print $3}')
          {
            echo "### Adaptation ${DATE} (${TA_KM} km crop, batch $BATCH)"
            echo "- wall: ${total}s; TA loop: ${ta}s for $((NEPOCH + 1)) steps"
            echo "- extrapolated 150-step TA: $(awk -v t="$ta" -v n="$NEPOCH" 'BEGIN{printf "%.0f min", t/(n+1)*151/60}')"
            echo "- peak memory: $(sed -E 's/MEM ([0-9]+) MB.*/\1/' "$RUNNER_TEMP/mem.log" | sort -n | tail -1) MB"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage adapted weights
        if: always()
        run: |
          mkdir -p stage
          cp LightSenGLEAN/weights/gens_light_sen_glean_TA.pt norm.json LightSenGLEAN/Testing/ta.log stage/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ta-${{ matrix.date }}
          path: stage
          retention-days: 30
          if-no-files-found: error

  infer:
    needs: [prep, adapt]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prep.outputs.CHUNKS) }}
    name: ${{ matrix.date }} chunk ${{ matrix.idx }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/ayush12gupta/senglean-env:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      DATE: ${{ matrix.date }}
      IDX: ${{ matrix.idx }}
      ITEMS: ${{ matrix.items }}
      EPSG: ${{ matrix.epsg }}
      CORE: ${{ matrix.core }}
      PADDED: ${{ matrix.padded }}
    steps:
      - name: Hardware
        run: |
          echo "HW $(lscpu | awk -F: '/Model name/{gsub(/^ +/,"",$2); print $2}') | nproc=$(nproc) | load=$(cut -d' ' -f1-3 /proc/loadavg) | ram=$(free -m | awk 'NR==2{print $2}')MB"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ta-${{ matrix.date }}
          path: ta

      - name: Build padded chunk clip
        run: |
          /opt/dv/bin/python ci/make_clip.py --items "$ITEMS" --epsg "$EPSG" --bounds $PADDED --out data/chunk.tif

      - name: Inference (shared adapted weights and normalisation)
        working-directory: LightSenGLEAN/Testing
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY' 2>&1 | tee infer.log
          import json, os, sys
          sys.path.insert(0, ".")
          from inference_utils import generate_raster_senglean
          ws = os.environ["GITHUB_WORKSPACE"]
          generate_raster_senglean(ws + "/data/chunk_enhanced.tif", ws + "/ta/gens_light_sen_glean_TA.pt", raster_file=ws + "/data/chunk.tif",
                                   scale=2, mscale=2, pad=5, model="light_senglean", ms_norm=json.load(open(ws + "/ta/norm.json")))
          PY

      - name: Crop to core
        run: |
          mkdir -p out
          /opt/dv/bin/python ci/crop_core.py data/chunk_enhanced.tif "out/chunk_${DATE}_${IDX}.tif" $CORE
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.date }}-${{ matrix.idx }}
          path: out/chunk_${{ matrix.date }}_${{ matrix.idx }}.tif
          retention-days: 7

  merge:
    needs: [prep, infer]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prep.outputs.DAYS) }}
    name: merge ${{ matrix.date }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ayush12gupta/senglean-env:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    env:
      DATE: ${{ matrix.date }}
    steps:
      - name: Hardware
        run: |
          echo "HW $(lscpu | awk -F: '/Model name/{gsub(/^ +/,"",$2); print $2}') | nproc=$(nproc) | load=$(cut -d' ' -f1-3 /proc/loadavg) | ram=$(free -m | awk 'NR==2{print $2}')MB"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-${{ matrix.date }}-*
          merge-multiple: true
          path: chunks
      - name: Stitch chunks
        run: |
          mkdir -p result
          /opt/dv/bin/python ci/merge_chunks.py "result/senglean_${DATE}.tif" chunks/*.tif
          ls -lh result
      - uses: actions/upload-artifact@v4
        with:
          name: senglean-${{ matrix.date }}
          path: result/senglean_${{ matrix.date }}.tif
          retention-days: 30
