# Builds the environment image used by the senglean workflow and pushes it to ghcr.io/<owner>/senglean-env.
name: build-env
on:
  workflow_dispatch:
  push:
    branches: [main, chunked-inference]
    paths: ["docker/**", ".github/workflows/build-env.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/senglean-env:1"
          docker build -t "$IMG" docker
          docker push "$IMG"
          docker image ls "$IMG"
