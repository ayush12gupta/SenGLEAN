name: LightSenGLEAN target adaptation + inference (CPU)

on:
  push: # temporary: lets this branch run before the file exists on main (dispatch needs it there)
    branches: [ta-skip-eval-cpu-fixes]
    paths: [".github/workflows/ta-infer.yml", "ci/**"]
  workflow_dispatch:
    inputs:
      nepoch:
        description: "Target-adaptation steps (use 5 first to time it; the full run is 150)"
        default: "5"
      batch:
        description: "TA batch size (1 to fit 7 GB private runners)"
        default: "1"
      ta_km:
        description: "Adapt on a centered crop of this size (km); inference still runs on the whole clip"
        default: "6"
      start_date:
        description: "Scene search start (leaf-on months avoid snow)"
        default: "2025-06-01"
      end_date:
        default: "2025-09-15"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # hosted-runner hard cap is 360
    defaults:
      run:
        shell: bash # -eo pipefail, so `| tee` cannot hide a failure
    env:
      NEPOCH: ${{ inputs.nepoch || '5' }}
      BATCH: ${{ inputs.batch || '1' }}
      TA_KM: ${{ inputs.ta_km || '6' }}
      START: ${{ inputs.start_date || '2025-06-01' }}
      END: ${{ inputs.end_date || '2025-09-15' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # repo imports distutils (gone in 3.12)

      - name: Swap (safety margin on 7 GB runners)
        run: |
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile && free -m

      - name: System libs (GDAL)
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev gdal-bin

      - name: Model deps (CPU torch)
        run: |
          pip install setuptools wheel numpy==1.24.4
          pip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-build-isolation "GDAL==$(gdal-config --version)"
          echo "numpy==1.24.4" > "$RUNNER_TEMP/c.txt" # torch 2.0.1 breaks on numpy 2.x; keep every later install under 1.x
          pip install -c "$RUNNER_TEMP/c.txt" scipy pillow scikit-image opencv-python-headless==4.8.0.74 tqdm pytorch-msssim \
            easydict matplotlib imageio requests psutil click torchmetrics==1.0.1 gdown
          python -c "import numpy, torch; torch.from_numpy(numpy.zeros(1)); print('numpy', numpy.__version__, 'torch', torch.__version__)"

      - name: Data deps (separate venv, newer numpy)
        run: |
          python -m venv "$RUNNER_TEMP/dv"
          "$RUNNER_TEMP/dv/bin/pip" install pystac-client planetary-computer odc-stac rioxarray geopandas shapely

      - name: Build Sentinel-2 clip
        run: |
          "$RUNNER_TEMP/dv/bin/python" ci/make_clip.py --aoi ci/fredericton_aoi.geojson \
            --start "$START" --end "$END" --out data/s2_data_clip.tif

      - name: Base weights (cached)
        id: w
        uses: actions/cache@v4
        with:
          path: LightSenGLEAN/weights/gens_light_sen_glean.pt
          key: weights-light-1xYVdb8y

      - name: Download base weights
        if: steps.w.outputs.cache-hit != 'true'
        run: |
          gdown 1xYVdb8ylri04ChkkcUbesVxzo3RDBcoa -O LightSenGLEAN/weights/gens_light_sen_glean.pt
          test "$(stat -c%s LightSenGLEAN/weights/gens_light_sen_glean.pt)" -gt 100000000 # Drive quota pages are tiny HTML

      - name: Crop center for adaptation
        run: |
          "$RUNNER_TEMP/dv/bin/python" ci/crop_center.py data/s2_data_clip.tif data/s2_data_ta.tif "$TA_KM"

      - name: Target adaptation (small crop)
        working-directory: LightSenGLEAN/Testing
        run: |
          start=$(date +%s)
          ( while true; do echo "MEM $(free -m | awk 'NR==2{print $3}') MB of $(free -m | awk 'NR==2{print $2}')" | tee -a "$RUNNER_TEMP/mem.log"; sleep 5; done ) &
          trap 'kill $! 2>/dev/null' EXIT
          python eval_light_glean_all.py --checkpoint_g ../weights/gens_light_sen_glean.pt \
            --checkpoint_d ../weights/discs_all.pt --batch "$BATCH" --nepoch "$NEPOCH" --do_TA \
            --data_path "$GITHUB_WORKSPACE/data/s2_data_ta.tif" 2>&1 | tee ta.log
          total=$(( $(date +%s) - start ))
          ta=$(grep 'Time Elapsed' ta.log | tail -1 | awk '{print $3}')
          {
            echo "### Adaptation (${TA_KM} km crop, batch $BATCH)"
            echo "- wall: ${total}s; TA loop: ${ta}s for $((NEPOCH + 1)) steps"
            echo "- extrapolated 150-step TA: $(awk -v t="$ta" -v n="$NEPOCH" 'BEGIN{printf "%.0f min", t/(n+1)*151/60}')"
            echo "- peak memory: $(sed -E 's/MEM ([0-9]+) MB.*/\1/' "$RUNNER_TEMP/mem.log" | sort -n | tail -1) MB"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inference on full clip (adapted weights)
        working-directory: LightSenGLEAN/Testing
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          start=$(date +%s)
          : > "$RUNNER_TEMP/mem.log"
          ( while true; do echo "MEM $(free -m | awk 'NR==2{print $3}') MB of $(free -m | awk 'NR==2{print $2}')" | tee -a "$RUNNER_TEMP/mem.log"; sleep 5; done ) &
          trap 'kill $! 2>/dev/null' EXIT
          python - <<'PY' 2>&1 | tee infer.log
          import os, sys
          sys.path.insert(0, ".")
          from inference_utils import generate_raster_senglean
          raw = os.environ["GITHUB_WORKSPACE"] + "/data/s2_data_clip.tif"
          generate_raster_senglean(raw[:-4] + "_lightsenglean_enhanced.tif", "../weights/gens_light_sen_glean_TA.pt",
                                   raster_file=raw, scale=2, mscale=2, pad=5, model="light_senglean")
          PY
          {
            echo "### Inference (full clip)"
            echo "- wall: $(( $(date +%s) - start ))s; peak memory: $(sed -E 's/MEM ([0-9]+) MB.*/\1/' "$RUNNER_TEMP/mem.log" | sort -n | tail -1) MB"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senglean-output
          retention-days: 7
          path: |
            data/s2_data_clip_lightsenglean_enhanced.tif
            LightSenGLEAN/weights/gens_light_sen_glean_TA.pt
            LightSenGLEAN/Testing/ta.log
            LightSenGLEAN/Testing/infer.log
